name: Bug report
description: Something in the app does not work.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A caution that is missing or wrong is the most important kind of bug here. Say so
        plainly if that is what happened, and where the right wording comes from.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: checkboxes
    id: severity
    attributes:
      label: Is it about safety
      options:
        - label: A caution is missing, wrong or hard to find
  - type: input
    id: version
    attributes:
      label: App version
      description: On the Herbs screen, the ⓘ button.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Mudita Kompakt, Android 12
