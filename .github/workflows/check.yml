name: Check

# Releases are built and signed locally, not here. This only checks pushes and pull
# requests on the way in: the unit tests, and the herb book's own check.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No signing key is restored here on purpose. Nothing this job does needs one, and
      # a pull request from a fork cannot read the secrets anyway — asking for them would
      # only mean every outside contribution failed on a step that was never about them.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      # The herb book: every herb sourced and cautioned, no "cure" or "treats", no
      # preparation on a don't-use page.
      - name: Check the herb book
        run: python3 tools/check-cautions.py
